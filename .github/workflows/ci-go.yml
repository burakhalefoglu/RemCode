name: ci-go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.5"

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The CLI ships on all three; a Windows-only path break must fail here,
        # not in a user's install.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  loop-gate:
    name: loop gate (canary + T0–T2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gate tooling
        run: |
          go install github.com/google/addlicense@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # Canary first: a gate that cannot detect breakage makes every later
      # green meaningless, so prove the instruments work before reading them.
      - name: Canary — can the gates still detect breakage?
        run: go run ./scripts/gate canary

      - name: Tier 0 — format, compile, vet
        run: go run ./scripts/gate t0

      - name: Tier 1 — lint, tests, conformance, fake-green
        run: go run ./scripts/gate t1

      - name: Tier 2 — coverage ratchet, spec fidelity, licences
        run: go run ./scripts/gate t2

      # Tier 3's race detector is covered by the Linux leg of the test matrix.
      # `verify` is deliberately NOT run here: its job is to declare
      # human-readiness and it fails while any spec is draft — which is the
      # correct state for a spec awaiting ratification, not a broken build.
      - name: Spec status (informational)
        if: always()
        run: go run ./scripts/gate spec || true

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Broken doc links shipped once already — every relative link and
      # heading anchor is verified on every PR now.
      - name: Check documentation links and anchors
        run: go run ./scripts/checkdocs

  tidy:
    name: go.mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit"
            exit 1
          fi
