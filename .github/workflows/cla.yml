# Contributor License Agreement gate — see CLA.md and ADR-003.
#
# SETUP REQUIRED before this does anything:
#   1. Create a private repo to hold signatures (e.g. burakhalefoglu/cla-signatures).
#   2. Create a PAT with `repo` scope on that repository.
#   3. Add it to this repo as the secret PERSONAL_ACCESS_TOKEN.
#
# Until then the job exits cleanly with a notice rather than blocking PRs —
# a broken gate that blocks every contribution is worse than no gate.

name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLA gate is not configured — see the setup notes in .github/workflows/cla.yml"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CLA assistant
        if: |
          steps.config.outputs.ready == 'true' &&
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
           github.event_name == 'pull_request_target')
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: https://github.com/burakhalefoglu/RemLinkAgent/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          remote-organization-name: burakhalefoglu
          remote-repository-name: cla-signatures
          branch: main
          allowlist: burakhalefoglu,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: |
            Thanks for the pull request!

            RemLinkAgent requires a one-time [Contributor License Agreement](https://github.com/burakhalefoglu/RemLinkAgent/blob/main/CLA.md).
            You keep your copyright — the CLA grants a licence, it does not transfer ownership.
            Why it is required: [ADR-003](https://github.com/burakhalefoglu/RemLinkAgent/blob/main/docs/decisions.md#adr-003--cla-required).

            To sign, comment exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"
