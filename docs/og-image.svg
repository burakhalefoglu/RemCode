  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans  { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono  { font-family: 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0d1117"/>
  <circle cx="120" cy="90" r="420" fill="url(#orbBlue)"/>
  <circle cx="1090" cy="560" r="400" fill="url(#orbPurple)"/>

  <!-- link glyph -->
  <g transform="translate(84 78)" fill="none" stroke="#2f81f7" stroke-width="7" stroke-linecap="round">
    <path d="M18 30 a18 18 0 0 1 25 0 l14 14 a18 18 0 0 1 0 25"/>
    <path d="M44 62 a18 18 0 0 1 -25 0 l-14 -14 a18 18 0 0 1 0 -25"/>
    <path d="M22 46 l22 0" stroke="#a371f7"/>
  </g>

  <text x="164" y="132" class="sans" font-size="34" font-weight="700" fill="#8b949e" letter-spacing="4">
    REMLINKAGENT
  </text>

  <text x="84" y="270" class="sans" font-size="66" font-weight="800" fill="url(#title)">
    One model writes it.
  </text>
  <text x="84" y="348" class="sans" font-size="66" font-weight="800" fill="url(#title)">
    A different one proves
  </text>
  <text x="84" y="426" class="sans" font-size="66" font-weight="800" fill="url(#title)">
    it. You approve.
  </text>

  <text x="84" y="486" class="sans" font-size="27" fill="#8b949e">
    Multi-model cross-verification · your subscriptions · end-to-end encrypted
  </text>

  <!-- provider chips -->
  <g class="sans" font-size="21" font-weight="600">
    <rect x="84"  y="524" width="118" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="143" y="553" fill="#e6edf3" text-anchor="middle">Coder</text>

    <rect x="216" y="524" width="118" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="275" y="553" fill="#e6edf3" text-anchor="middle">Reviewer</text>

    <rect x="348" y="524" width="118" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="407" y="553" fill="#e6edf3" text-anchor="middle">Gates</text>

    <rect x="480" y="524" width="250" height="46" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="605" y="553" fill="#8b949e" text-anchor="middle">any ACP agent</text>
  </g>

  <text x="1116" y="553" class="mono" font-size="20" fill="#3fb950" text-anchor="end">
    AGPL v3 · open source
  </text>
</svg>
