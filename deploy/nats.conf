server_name: rla-nats
port: 4222

# Monitoring endpoint — /healthz backs the container healthcheck.
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"

  # Ceilings for a self-hosted single-node relay. Per-stream retention is set
  # by the server at stream creation and is the limit that actually governs
  # data lifetime — see docs/architecture.md#retention.
  max_memory_store: 256MB
  max_file_store: 4GB
}

# Payloads are end-to-end encrypted (ADR-004), so a message is ciphertext plus
# a small envelope. 1MB is generous; capping it bounds the damage a
# misbehaving or hostile client can do to disk.
max_payload: 1MB

max_connections: 1000
max_control_line: 4KB

# Slow consumers are expected here: phones go offline constantly. Buffer
# generously and let JetStream replay handle the rest rather than dropping.
write_deadline: "10s"

debug: false
trace: false
logtime: true
